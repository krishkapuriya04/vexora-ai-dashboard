<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VEXORA Reports — Executive summaries, report library, export and download business intelligence reports.">
  <meta name="robots" content="noindex, nofollow">
  <title>Reports — VEXORA</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/upgrade.css">
  <link rel="stylesheet" href="../css/polish.css">
</head>
<body class="app">

  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-bg__layer aurora-bg__layer--1"></div>
    <div class="aurora-bg__layer aurora-bg__layer--2"></div>
    <div class="aurora-bg__layer aurora-bg__layer--3"></div>
  </div>
  <div class="mesh-bg" aria-hidden="true"></div>
  <div id="particle-canvas" class="particle-layer" aria-hidden="true"></div>

  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb bg-orb--primary"></div>
    <div class="bg-orb bg-orb--secondary"></div>
  </div>

  <div class="app-layout">
    <div id="sidebar-slot"></div>

    <div class="app-main">
      <div id="topbar-slot"></div>

      <main class="app-content" id="main-content">
        <div class="page-skeleton" aria-hidden="true">
          <div class="skeleton-grid" style="grid-template-columns: repeat(4, 1fr);">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
          <div class="skeleton" style="height: 300px; margin-top: 24px;"></div>
        </div>

        <div class="page-content">
          <header class="page-header reveal">
            <h1 class="page-header__title">Reports</h1>
            <p class="page-header__subtitle">Executive summaries, automated reports, and export tools</p>
          </header>

          <!-- Executive Summaries -->
          <section aria-label="Executive summary metrics">
            <h2 class="widget__title" style="margin-bottom: var(--space-4);">Executive Summary — May 2026</h2>
            <div class="exec-summaries" id="exec-summaries"></div>
          </section>

          <!-- Reports Toolbar -->
          <div class="reports-toolbar reveal">
            <div class="reports-filters" role="tablist" aria-label="Filter reports">
              <button class="filter-chip is-active" type="button" role="tab" aria-selected="true">All Reports</button>
              <button class="filter-chip" type="button" role="tab" aria-selected="false">Executive</button>
              <button class="filter-chip" type="button" role="tab" aria-selected="false">Financial</button>
              <button class="filter-chip" type="button" role="tab" aria-selected="false">AI</button>
              <button class="filter-chip" type="button" role="tab" aria-selected="false">Marketing</button>
            </div>
            <div class="reports-export-actions btn-group">
              <button class="btn btn--primary btn--sm" id="create-report-btn" type="button">+ Create Report</button>
              <button class="btn btn--secondary btn--sm" id="export-pdf-btn" type="button">Export PDF</button>
              <button class="btn btn--secondary btn--sm" id="export-excel-btn" type="button">Export Excel</button>
              <button class="btn btn--secondary btn--sm" id="export-csv-btn" type="button">Export CSV</button>
              <button class="btn btn--primary btn--sm" id="export-trigger" type="button">⬇ Export All</button>
            </div>
          </div>

          <!-- Reports Library -->
          <section aria-label="Reports library">
            <div class="reports-grid" id="reports-grid"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="modals-slot"></div>

  <!-- Export Modal -->
  <div class="modal export-modal" id="export-modal" role="dialog" aria-modal="true" aria-label="Export reports" hidden>
    <div class="modal__backdrop" data-close-export></div>
    <div class="modal__panel export-modal__panel">
      <h2 class="export-modal__title">Export Reports</h2>
      <div class="export-modal__options">
        <label class="export-option is-selected">
          <input type="radio" name="format" value="pdf" checked>
          <div>
            <strong>PDF Document</strong>
            <p class="text-sm text-muted">High-quality printable format</p>
          </div>
        </label>
        <label class="export-option">
          <input type="radio" name="format" value="csv">
          <div>
            <strong>CSV Spreadsheet</strong>
            <p class="text-sm text-muted">Raw data for analysis</p>
          </div>
        </label>
        <label class="export-option">
          <input type="radio" name="format" value="xlsx">
          <div>
            <strong>Excel Workbook</strong>
            <p class="text-sm text-muted">Formatted with charts</p>
          </div>
        </label>
      </div>
      <div class="btn-group">
        <button class="btn btn--primary" type="button" id="export-modal-start">Start Export</button>
        <button class="btn btn--secondary" type="button" data-close-export>Cancel</button>
      </div>
    </div>
  </div>

  <!-- Report Create/Edit Modal -->
  <div class="modal admin-modal" id="report-form-modal" role="dialog" aria-modal="true" aria-label="Report form" hidden>
    <div class="modal__backdrop" data-close-report-modal></div>
    <div class="modal__panel admin-modal__panel glass-card">
      <h2 class="export-modal__title" id="report-form-title">Create Report</h2>
      <form id="report-form">
        <input type="hidden" id="report-form-id" value="">
        <div class="admin-modal__field">
          <label for="report-title">Title</label>
          <input class="settings-input" id="report-title" type="text" required maxlength="120">
        </div>
        <div class="admin-modal__field">
          <label for="report-category">Category</label>
          <select class="settings-input" id="report-category">
            <option value="Executive">Executive</option>
            <option value="Financial">Financial</option>
            <option value="Customer">Customer</option>
            <option value="AI">AI</option>
            <option value="Marketing">Marketing</option>
            <option value="Product">Product</option>
          </select>
        </div>
        <div class="admin-modal__field">
          <label for="report-description">Description</label>
          <textarea class="settings-input" id="report-description" rows="3"></textarea>
        </div>
        <div class="btn-group" style="margin-top: var(--space-4);">
          <button class="btn btn--primary" type="submit" id="report-form-submit">Save Report</button>
          <button class="btn btn--secondary" type="button" data-close-report-modal>Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Report Preview Modal -->
  <div class="modal admin-modal" id="report-preview-modal" role="dialog" aria-modal="true" aria-label="Report preview" hidden>
    <div class="modal__backdrop" data-close-report-preview></div>
    <div class="modal__panel admin-modal__panel glass-card">
      <h2 class="export-modal__title" id="report-preview-title">Report Preview</h2>
      <p id="report-preview-body" class="settings-row__hint"></p>
      <div class="btn-group" style="margin-top: var(--space-4);">
        <button class="btn btn--secondary" type="button" data-close-report-preview>Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../js/api-config.js"></script>
  <script type="module" src="../js/pages/reports.js"></script>
</body>
</html>
